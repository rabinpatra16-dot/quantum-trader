<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DreamTrader | PRO Grid Dashboard</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' stop-color='%2338bdf8' /><stop offset='100%' stop-color='%23a855f7' /></linearGradient></defs><rect width='100' height='100' rx='25' fill='url(%23g)'/><text x='50%' y='55%' font-family='sans-serif' font-weight='900' font-size='70' fill='white' dominant-baseline='middle' text-anchor='middle'>₹</text></svg>">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        :root { --bg-main: #060b19; }
        body { background-color: var(--bg-main); color: #f8fafc; transition: 0.3s; }
        .glass-card { background: rgba(13, 19, 38, 0.65); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; }
        .input-ultra { background: rgba(4, 9, 20, 0.8); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px; padding: 12px 16px; width: 100%; color: white; }
        .btn-ultra { background: linear-gradient(135deg, #0ea5e9, #9333ea); color: white; font-weight: 800; padding: 14px; border-radius: 12px; }
        body.light-theme { background-color: #f3f4f6; color: #000; }
        body.light-theme .glass-card { background: #ffffff; border-color: #d1d5db; }
        body.light-theme .input-ultra { background: #ffffff; border-color: #94a3b8; color: #000; }
    </style>
</head>
<body class="min-h-screen">

    <!-- Auth Screen -->
    <div id="authScreen" class="fixed inset-0 bg-[#060b19] z-[100] flex items-center justify-center p-4">
        <div class="glass-card p-8 w-full max-w-md">
            <h1 class="text-3xl font-black mb-6 text-center">DREAM<span class="text-sky-400">TRADER</span></h1>
            <input type="email" id="authEmail" class="input-ultra mb-4" placeholder="Email">
            <input type="password" id="authPassword" class="input-ultra mb-6" placeholder="Password">
            <button onclick="loginUser()" class="w-full btn-ultra">Login</button>
        </div>
    </div>

    <!-- Main Content -->
    <div id="appContainer" class="p-4 md:p-8 hidden">
        <header class="flex justify-between items-center mb-8 glass-card p-5">
            <h1 class="text-2xl font-black">DREAM<span class="text-sky-400">TRADER</span></h1>
            <div class="flex gap-2">
                <button onclick="toggleTheme()" class="bg-slate-700 px-4 py-2 rounded-lg text-xs">Theme</button>
                <button onclick="logoutUser()" class="bg-slate-700 px-4 py-2 rounded-lg text-xs">Logout</button>
            </div>
        </header>

        <div class="flex justify-center mb-8">
            <button onclick="openTradeModal()" class="btn-ultra px-8 py-3 text-sm uppercase">➕ Add New Position</button>
        </div>

        <div id="multiChartContainer" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
    </div>

    <!-- Trade Modal (Popup) -->
    <div id="tradeModal" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-50 p-4">
        <div class="glass-card p-8 w-full max-w-md">
            <h2 class="text-lg font-black text-white mb-6">🚀 Execute Order</h2>
            <form id="tradeForm" class="space-y-4">
                <input type="text" id="symbol" placeholder="Symbol (e.g. RELIANCE)" required class="input-ultra uppercase">
                <div class="grid grid-cols-2 gap-3">
                    <select id="type" class="input-ultra"><option value="LONG">LONG</option><option value="SHORT">SHORT</option></select>
                    <input type="number" id="qty" placeholder="Quantity" required class="input-ultra">
                </div>
                <input type="number" id="entry" placeholder="Entry Price" required class="input-ultra">
                <div class="flex gap-2 mt-4">
                    <button type="button" onclick="closeTradeModal()" class="flex-1 bg-slate-800 py-3 rounded-xl">Cancel</button>
                    <button type="submit" class="flex-1 btn-ultra py-3">Deploy Trade</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Modal & Theme Controls
        function openTradeModal() { document.getElementById('tradeModal').style.display = 'flex'; }
        function closeTradeModal() { document.getElementById('tradeModal').style.display = 'none'; }
        function toggleTheme() { document.body.classList.toggle('light-theme'); }

        // আপনার Firebase এবং অন্যান্য লজিক এখানে আগের মতোই থাকবে
        // [সাইটটি সচল রাখতে আপনার FirebaseConfig ও অন্যান্য ফাংশন এখানে যুক্ত করুন]
    </script>
</body>
</html>
