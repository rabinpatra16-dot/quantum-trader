<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuantumTrader | PRO Grid Dashboard</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#060b19">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2933/2933116.png">

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <!-- Utilities & UI -->
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    
    <!-- Superfast Socket.IO Link -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #060b19;
            --glass-bg: rgba(13, 19, 38, 0.65);
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent-glow: rgba(56, 189, 248, 0.15);
        }
        body { 
            background-color: var(--bg-main); 
            color: #f8fafc; 
            font-family: 'Inter', sans-serif;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(14, 165, 233, 0.06), transparent 50%),
                radial-gradient(circle at 90% 80%, rgba(168, 85, 247, 0.06), transparent 50%),
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 30px 30px, 30px 30px;
        }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .glass-card { 
            background: var(--glass-bg); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); 
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            border-radius: 16px;
            transition: all 0.3s ease;
        }
        .kpi-card { position: relative; overflow: hidden; }
        .kpi-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; }
        .kpi-green::before { background: linear-gradient(to bottom, #10b981, #047857); }
        .kpi-blue::before { background: linear-gradient(to bottom, #38bdf8, #0284c7); }
        .kpi-purple::before { background: linear-gradient(to bottom, #a855f7, #6b21a8); }
        .kpi-gray::before { background: linear-gradient(to bottom, #94a3b8, #475569); }
        
        .input-ultra { 
            background: rgba(4, 9, 20, 0.8); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            border-radius: 12px; 
            padding: 12px 16px; 
            color: #f1f5f9; 
            width: 100%; 
            outline: none; 
            transition: all 0.3s ease; 
        }
        .input-ultra:focus { 
            border-color: #38bdf8; 
            background: rgba(10, 15, 30, 0.9);
        }
        .btn-ultra { 
            background: linear-gradient(135deg, #0ea5e9 0%, #4f46e5 50%, #9333ea 100%); 
            color: white; font-weight: 800; padding: 14px; border-radius: 12px; 
            transition: all 0.3s; box-shadow: 0 4px 15px rgba(79, 70, 229, 0.3);
        }
        .btn-ultra:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(79, 70, 229, 0.5); filter: brightness(1.1); }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.3); border-radius: 10px; }
        
        .live-glow { animation: pulseGlow 2s infinite; }
        @keyframes pulseGlow { 0% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.6); } 70% { box-shadow: 0 0 0 8px rgba(56, 189, 248, 0); } 100% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0); } }
        
        /* Hide arrows from number input */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="min-h-screen">

    <!-- Auth Screen -->
    <div id="authScreen" class="fixed inset-0 bg-[#060b19] z-[100] flex items-center justify-center p-4">
        <div class="glass-card p-8 w-full max-w-md border-sky-500/30">
            <h1 class="text-3xl font-black tracking-tighter mb-2 text-center">QUANTUM<span class="text-sky-400">TRADER</span></h1>
            <p class="text-xs text-slate-400 mb-8 text-center uppercase tracking-widest">Login to your workspace</p>
            <input type="email" id="authEmail" placeholder="Email address" class="input-ultra font-mono text-sm mb-4">
            <input type="password" id="authPassword" placeholder="Password" class="input-ultra font-mono text-sm mb-6">
            <div class="flex gap-3">
                <button onclick="loginUser()" class="flex-1 btn-ultra text-xs uppercase tracking-wider">Login</button>
            </div>
            <div class="relative flex items-center py-5">
                <div class="flex-grow border-t border-slate-700/50"></div>
                <span class="flex-shrink-0 mx-4 text-slate-500 text-[10px] uppercase font-bold tracking-widest">OR</span>
                <div class="flex-grow border-t border-slate-700/50"></div>
            </div>
            <button onclick="loginWithGoogle()" class="w-full bg-slate-100 text-slate-900 font-bold py-3.5 rounded-xl transition flex justify-center items-center gap-3">
                <svg class="w-5 h-5" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                <span class="text-xs uppercase tracking-wider">Continue with Google</span>
            </button>
            <p id="authError" class="text-rose-400 text-xs mt-4 text-center font-bold"></p>
        </div>
    </div>

    <!-- Main App Container -->
    <div id="appContainer" class="p-4 md:p-6 lg:p-8 hidden">
        <input type="file" id="importFile" accept=".xlsx, .xls" class="hidden" onchange="importData(event)">
        
        <div class="max-w-[1800px] mx-auto">
            <!-- Header -->
            <header class="flex justify-between items-center mb-8 bg-slate-900/40 p-5 rounded-2xl border border-slate-800/50 backdrop-blur-md">
                <div>
                    <h1 class="text-2xl font-black tracking-tighter">QUANTUM<span class="text-sky-400">TRADER</span> <span class="text-[10px] text-sky-400 border border-sky-500/30 bg-sky-500/10 px-2 py-0.5 rounded ml-2 align-middle font-mono">GRID V9</span></h1>
                    <p class="text-[10px] text-slate-400 mt-1 uppercase font-mono tracking-widest flex items-center gap-2">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 live-glow"></span> 
                        <span id="userEmailDisplay" class="text-sky-400"></span>
                    </p>
                </div>
                <div class="flex gap-2">
                    <button onclick="triggerImport()" class="text-[10px] font-bold text-emerald-400 bg-emerald-500/10 hover:bg-emerald-500/20 border border-emerald-500/20 px-4 py-2 rounded-lg transition uppercase tracking-wider">⬆️ Import</button>
                    <button onclick="exportData()" class="text-[10px] font-bold text-blue-400 bg-blue-500/10 hover:bg-blue-500/20 border border-blue-500/20 px-4 py-2 rounded-lg transition uppercase tracking-wider">⬇️ Export</button>
                    <button onclick="logoutUser()" class="text-[10px] font-bold text-slate-400 bg-slate-800/50 hover:bg-slate-700 border border-slate-700/50 px-4 py-2 rounded-lg transition uppercase tracking-wider">Logout</button>
                </div>
            </header>

            <div class="grid grid-cols-1 xl:grid-cols-12 gap-6">
                <!-- Left Sidebar: Trade Execution -->
                <div class="xl:col-span-3 space-y-6 h-fit sticky top-6">
                    <div class="glass-card p-6 border-t-4 border-t-indigo-500">
                        <h2 class="text-xs font-bold text-white uppercase tracking-widest flex items-center gap-2 mb-6">🚀 Execute Order</h2>
                        <form id="tradeForm" class="space-y-4">
                            <div>
                                <label class="block text-[10px] font-bold text-slate-400 mb-1.5 uppercase tracking-wider">Symbol</label>
                                <input type="text" id="symbol" list="tickers" placeholder="e.g. RELIANCE" required autocomplete="off" class="input-ultra font-mono text-sm uppercase">
                                <datalist id="tickers"></datalist>
                            </div>
                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-[10px] font-bold text-slate-400 mb-1.5 uppercase tracking-wider">Direction</label>
                                    <select id="type" class="input-ultra text-xs font-bold p-2 h-[42px] cursor-pointer">
                                        <option value="LONG">LONG (Buy)</option>
                                        <option value="SHORT">SHORT (Sell)</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-[10px] font-bold text-slate-400 mb-1.5 uppercase tracking-wider">Quantity</label>
                                    <input type="number" id="qty" placeholder="0" required step="any" min="0.001" class="input-ultra font-mono text-sm h-[42px]">
                                </div>
                            </div>
                            <div class="p-4 bg-slate-900/60 rounded-xl border border-slate-700/50 shadow-inner">
                                <label class="block text-[10px] font-bold text-sky-400 mb-1.5 uppercase tracking-wider">Entry Price</label>
                                <input type="number" id="entry" placeholder="0.00" required step="any" class="input-ultra font-mono text-lg text-sky-400 font-bold bg-slate-950/50 border-sky-500/20 mb-3">
                                <div class="grid grid-cols-2 gap-3">
                                    <div>
                                        <label class="block text-[10px] font-bold text-rose-400 mb-1.5 uppercase tracking-wider">SL (%)</label>
                                        <input type="number" id="sl_pct" placeholder="e.g. 1.5" step="any" class="input-ultra font-mono text-xs border-rose-900/30 bg-rose-950/20 text-rose-300">
                                    </div>
                                    <div>
                                        <label class="block text-[10px] font-bold text-emerald-400 mb-1.5 uppercase tracking-wider">Target</label>
                                        <input type="number" id="exit" placeholder="0.00" step="any" class="input-ultra font-mono text-xs border-emerald-900/30 bg-emerald-950/20 text-emerald-300">
                                    </div>
                                </div>
                            </div>
                            <button type="submit" class="w-full btn-ultra text-xs uppercase tracking-widest mt-2">Deploy Trade</button>
                        </form>
                    </div>
                </div>

                <!-- Right Area: KPIs + Live Grid + Closed Ledger -->
                <div class="xl:col-span-9 space-y-6">
                    
                    <!-- Top Toolbar -->
                    <div class="flex justify-between items-center bg-slate-900/30 p-4 rounded-xl border border-slate-800">
                        <h2 class="text-sm font-black text-white flex items-center gap-3 tracking-wide">
                            <span class="w-3 h-3 rounded-full bg-sky-500 live-glow"></span> LIVE PORTFOLIO GRID
                        </h2>
                        <div class="flex gap-2">
                            <button id="autoSyncBtn" class="text-[10px] bg-slate-800/80 text-slate-300 px-4 py-2 rounded-lg uppercase font-bold border border-slate-600 transition">Syncing... ⌛</button>
                        </div>
                    </div>

                    <!-- KPI Row -->
                    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
                        <div class="glass-card kpi-card kpi-green p-5">
                            <h3 class="text-[10px] text-slate-400 uppercase font-bold mb-1 tracking-widest">Realized P&L</h3>
                            <p id="netPnL" class="text-2xl font-black font-mono tracking-tight text-emerald-400">₹0.00</p>
                        </div>
                        <div class="glass-card kpi-card kpi-blue p-5">
                            <h3 class="text-[10px] text-slate-400 uppercase font-bold mb-1 tracking-widest">Win Rate</h3>
                            <p id="winRateTxt" class="text-2xl font-black font-mono tracking-tight text-sky-400">0%</p>
                        </div>
                        <div class="glass-card kpi-card kpi-purple p-5">
                            <h3 class="text-[10px] text-slate-400 uppercase font-bold mb-1 tracking-widest">Capital Deployed</h3>
                            <p id="totalInvested" class="text-2xl font-black font-mono tracking-tight text-purple-400">₹0.00</p>
                        </div>
                        <div class="glass-card kpi-card kpi-gray p-5">
                            <h3 class="text-[10px] text-slate-400 uppercase font-bold mb-1 tracking-widest">Unrealized P&L</h3>
                            <p id="unrealizedPnL" class="text-2xl font-black font-mono tracking-tight text-slate-300">₹0.00</p>
                        </div>
                    </div>

                    <!-- Dynamic Multi-Chart Grid (Valvo Style) -->
                    <div id="multiChartContainer" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>

                    <!-- Closed Trades Ledger -->
                    <div class="glass-card overflow-hidden mt-8 opacity-90 border-t-2 border-slate-700">
                        <div class="p-4 border-b border-slate-800/50 bg-slate-900/40">
                            <h3 class="text-xs text-slate-400 font-bold uppercase tracking-widest">Closed Trade Ledger</h3>
                        </div>
                        <div class="overflow-x-auto max-h-[350px]">
                            <table class="w-full text-left text-sm whitespace-nowrap">
                                <thead>
                                    <tr class="bg-slate-900/80 text-[10px] text-slate-500 uppercase tracking-widest border-b border-slate-800/50 sticky top-0 backdrop-blur-md z-10">
                                        <th class="py-3 px-6">Asset & Date</th>
                                        <th class="py-3 px-6 text-center">Qty / Type</th>
                                        <th class="py-3 px-6">Entry → Exit</th>
                                        <th class="py-3 px-6 text-right">Realized P&amp;L</th>
                                        <th class="py-3 px-6 text-center">Action</th>
                                    </tr>
                                </thead>
                                <tbody id="closedTradeBody" class="divide-y divide-slate-800/40"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="fixed inset-0 bg-black/90 backdrop-blur-md hidden items-center justify-center z-50">
        <div class="glass-card p-6 w-full max-w-sm border-sky-500/30">
            <h3 class="text-sm font-black text-sky-400 mb-4 uppercase tracking-widest">✏️ Edit Position</h3>
            <input type="hidden" id="editTradeId">
            <div class="space-y-4 mb-6">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 mb-1 uppercase tracking-wider">Quantity</label>
                        <input type="number" id="editQty" step="any" required class="input-ultra font-mono text-sm">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 mb-1 uppercase tracking-wider">Entry Price</label>
                        <input type="number" id="editEntry" step="any" required class="input-ultra font-mono text-sm text-sky-400">
                    </div>
                </div>
            </div>
            <div class="flex gap-2">
                <button onclick="closeEditModal()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-white text-xs py-3 rounded-xl font-bold transition uppercase">Cancel</button>
                <button onclick="submitEditTrade()" class="flex-1 bg-gradient-to-r from-sky-600 to-blue-600 hover:from-sky-500 hover:to-blue-500 text-white text-xs py-3 rounded-xl font-bold transition uppercase">Save</button>
            </div>
        </div>
    </div>

    <!-- Close Modal -->
    <div id="closeModal" class="fixed inset-0 bg-black/90 backdrop-blur-md hidden items-center justify-center z-50">
        <div class="glass-card p-6 w-full max-w-sm border-purple-500/30">
            <h3 class="text-sm font-black text-white mb-4 uppercase tracking-widest" id="modalTitle">Close Position</h3>
            <input type="hidden" id="modalTradeId">
            <label class="block text-[10px] font-bold text-slate-400 mb-1 uppercase tracking-wider">Final Exit Price</label>
            <input type="number" id="modalExitPrice" placeholder="0.00" step="any" class="input-ultra font-mono text-lg mb-6 text-purple-400">
            <div class="flex gap-2">
                <button onclick="closeModalFunc()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-white text-xs py-3 rounded-xl font-bold transition uppercase">Cancel</button>
                <button onclick="submitCloseTrade()" class="flex-1 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white text-xs py-3 rounded-xl font-bold transition uppercase">Confirm</button>
            </div>
        </div>
    </div>

    <script>
        // ================= FIREBASE CONFIG =================
        const firebaseConfig = {
            apiKey: "AIzaSyCu9c7o5TYOrtplw6OJ7AIK13AxeqLUuEU",
            authDomain: "quantum-tracker-6fe30.firebaseapp.com",
            databaseURL: "https://quantum-tracker-6fe30-default-rtdb.firebaseio.com",
            projectId: "quantum-tracker-6fe30",
            storageBucket: "quantum-tracker-6fe30.firebasestorage.app",
            messagingSenderId: "691270990022",
            appId: "1:691270990022:web:3b11b58ed0fb2c2f4c7fc7"
        };
        firebase.initializeApp(firebaseConfig);
        const fbDatabase = firebase.database();
        const fbAuth = firebase.auth();
        const googleProvider = new firebase.auth.GoogleAuthProvider();

        let trades = [];
        let currentUser = null;
        let dbRef = null;
        
        // Alert Sound Setup
        const alertSound = new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg');

        // ================= TICKERS (DYNAMIC LIVE FETCH) =================
        document.addEventListener('DOMContentLoaded', async function() {
            const datalist = document.getElementById('tickers');
            try {
                const response = await fetch('https://public.fyers.in/sym_details/NSE_CM.csv');
                const csvText = await response.text();
                const matches = csvText.match(/NSE:(.*?)-EQ/g);
                if (matches) {
                    const uniqueSymbols = [...new Set(matches.map(s => s.replace('NSE:', '').replace('-EQ', '')))];
                    let optionsHTML = `<option value="NIFTY"></option><option value="BANKNIFTY"></option><option value="BTCUSDT"></option>`;
                    uniqueSymbols.forEach(symbol => optionsHTML += `<option value="${symbol}"></option>`);
                    datalist.innerHTML = optionsHTML;
                }
            } catch (error) {
                console.error("Symbol load error:", error);
                const popularStocks = ["NIFTY", "RELIANCE", "TCS", "HDFCBANK", "INFY"];
                let fallbackHTML = "";
                popularStocks.forEach(s => fallbackHTML += `<option value="${s}"></option>`);
                datalist.innerHTML = fallbackHTML;
            }
        });

        // ================= AUTH STATE =================
        fbAuth.onAuthStateChanged((user) => {
            if (user) {
                currentUser = user.uid;
                document.getElementById('authScreen').style.display = 'none';
                document.getElementById('appContainer').style.display = 'block';
                document.getElementById('userEmailDisplay').innerText = user.displayName || user.email;
                if (dbRef) dbRef.off();
                dbRef = fbDatabase.ref('users/' + currentUser + '/trades');
                dbRef.on('value', (snapshot) => {
                    trades = snapshot.val() || [];
                    renderUI(); // Updates KPIs & Ledger, then calls renderMultiCharts
                });
            } else {
                currentUser = null;
                document.getElementById('authScreen').style.display = 'flex';
                document.getElementById('appContainer').style.display = 'none';
                if (dbRef) { dbRef.off(); dbRef = null; }
                trades = [];
            }
        });

        function loginUser() {
            fbAuth.signInWithEmailAndPassword(document.getElementById('authEmail').value, document.getElementById('authPassword').value)
                .catch((error) => { document.getElementById('authError').innerText = error.message; });
        }
        function loginWithGoogle() {
            fbAuth.signInWithPopup(googleProvider).catch((error) => { document.getElementById('authError').innerText = error.message; });
        }
        function logoutUser() { fbAuth.signOut(); }
        function saveData() { if (currentUser) fbDatabase.ref('users/' + currentUser + '/trades').set(trades); }

        // ================= EXPORT / IMPORT =================
        function exportData() {
            if (trades.length === 0) return alert("No data to export!");
            const exportArr = trades.map(t => ({ "ID": t.id, "Date": t.date, "Symbol": t.symbol, "Type": t.type, "Quantity": t.qty, "Entry Price": t.entry, "Exit Price": t.exit || "", "Realized P&L": t.pnl || 0, "Status": t.status }));
            const ws = XLSX.utils.json_to_sheet(exportArr);
            const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "QuantumTrades");
            XLSX.writeFile(wb, "QuantumTrader_Backup_" + new Date().toISOString().split('T')[0] + ".xlsx");
        }
        function triggerImport() { document.getElementById('importFile').click(); }
        function importData(event) {
            const file = event.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const workbook = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
                    const json = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                    let count = 0;
                    json.forEach(row => {
                        const tradeId = row["ID"] || Date.now() + Math.random();
                        if (!trades.find(t => t.id === tradeId)) {
                            trades.push({ id: tradeId, date: row["Date"] || new Date().toLocaleDateString(), symbol: row["Symbol"], type: row["Type"], qty: parseFloat(row["Quantity"]) || 0, entry: parseFloat(row["Entry Price"]) || 0, sl: null, exit: parseFloat(row["Exit Price"]) || null, pnl: parseFloat(row["Realized P&L"]) || 0, status: row["Status"] || "OPEN", liveCMP: parseFloat(row["Entry Price"]) || 0, slHit: false });
                            count++;
                        }
                    });
                    trades.sort((a, b) => b.id - a.id); saveData(); alert(`Imported ${count} new trades successfully!`);
                } catch (err) { alert("Error parsing Excel file."); }
            }; reader.readAsArrayBuffer(file); event.target.value = '';
        }

        // ================= TV SYMBOL FORMATTER =================
        function formatTVSymbol(symbol) {
            if (symbol === "NIFTY") return "BSE:NIFTY50";
            if (symbol === "BANKNIFTY") return "BSE:BANKNIFTY";
            if (symbol.includes("USDT") || symbol.includes("BTC")) return "BINANCE:" + symbol;
            if (!symbol.includes(":")) return "BSE:" + symbol;
            return symbol;
        }

        // ================= TRADE MANAGEMENT =================
        document.getElementById('tradeForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const symbol = document.getElementById('symbol').value.toUpperCase().trim();
            const type = document.getElementById('type').value;
            const qty = parseFloat(document.getElementById('qty').value);
            const entry = parseFloat(document.getElementById('entry').value);
            
            const slPctVal = document.getElementById('sl_pct').value;
            let sl = null;
            if (slPctVal !== "" && !isNaN(slPctVal)) {
                sl = type === 'LONG' ? entry - (entry * parseFloat(slPctVal) / 100) : entry + (entry * parseFloat(slPctVal) / 100);
            }

            const exitVal = document.getElementById('exit').value;
            const isClosed = exitVal !== "" && !isNaN(exitVal);
            const exit = isClosed ? parseFloat(exitVal) : null;
            let pnl = isClosed ? (type === 'LONG' ? (exit - entry) * qty : (entry - exit) * qty) : 0;
            const dateStr = new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
            
            trades.unshift({ id: Date.now(), date: dateStr, symbol, type, qty, entry, sl: sl, exit, pnl, status: isClosed ? 'CLOSED' : 'OPEN', liveCMP: entry, slHit: false });
            saveData(); this.reset(); document.getElementById('symbol').focus();
            subscribeOpenTrades();
        });

        function deleteTrade(id) { if (confirm("Delete this trade entirely?")) { trades = trades.filter(t => t.id !== id); saveData(); } }
        
        function updateLiveCMP(id, newCMP) {
            const val = parseFloat(newCMP); if (isNaN(val)) return;
            const idx = trades.findIndex(t => t.id === id);
            if (idx > -1) { 
                trades[idx].liveCMP = val; 
                checkStopLoss(trades[idx]);
                saveData(); 
            }
        }

        function checkStopLoss(trade) {
            if (trade.sl && !trade.slHit) {
                if ((trade.type === 'LONG' && trade.liveCMP <= trade.sl) || (trade.type === 'SHORT' && trade.liveCMP >= trade.sl)) {
                    trade.slHit = true; saveData();
                    alertSound.play().catch(() => {});
                    alert(`🚨 SL HIT ALERT!\n\nSymbol: ${trade.symbol}\nType: ${trade.type}\nSL Price: ₹${trade.sl.toFixed(2)}\nCurrent Price: ₹${trade.liveCMP}`);
                }
            }
        }

        // ================= MODALS =================
        function openEditModal(id) {
            const t = trades.find(t => t.id === id); if (!t) return;
            document.getElementById('editTradeId').value = id;
            document.getElementById('editQty').value = t.qty;
            document.getElementById('editEntry').value = t.entry;
            document.getElementById('editModal').style.display = 'flex';
        }
        function closeEditModal() { document.getElementById('editModal').style.display = 'none'; }
        function submitEditTrade() {
            const t = trades.find(t => t.id === parseInt(document.getElementById('editTradeId').value));
            if (t) { t.qty = parseFloat(document.getElementById('editQty').value) || t.qty; t.entry = parseFloat(document.getElementById('editEntry').value) || t.entry; saveData(); closeEditModal(); }
        }

        function openCloseModal(id, symbol) {
            document.getElementById('modalTradeId').value = id; document.getElementById('modalTitle').innerText = `Close ${symbol}`;
            document.getElementById('closeModal').style.display = 'flex';
        }
        function closeModalFunc() { document.getElementById('closeModal').style.display = 'none'; }
        function submitCloseTrade() {
            const exit = parseFloat(document.getElementById('modalExitPrice').value); if (isNaN(exit)) return alert("Please enter valid price");
            const t = trades.find(t => t.id === parseInt(document.getElementById('modalTradeId').value));
            if (t) { t.exit = exit; t.status = 'CLOSED'; t.pnl = t.type === 'LONG' ? (exit - t.entry) * t.qty : (t.entry - exit) * t.qty; saveData(); closeModalFunc(); document.getElementById('modalExitPrice').value = ''; }
        }

        // ================= RENDER UI (KPIs & Closed Ledger) =================
        function renderUI() {
            let totalRealizedPnL = 0, totalWins = 0, closedCount = 0, totalInvestedAmt = 0, totalUnrealizedPnL = 0;
            const closedBody = document.getElementById('closedTradeBody'); closedBody.innerHTML = '';
            
            trades.forEach(t => {
                if (t.status === 'OPEN') {
                    totalInvestedAmt += t.qty * t.entry;
                    const liveCMP = t.liveCMP || t.entry;
                    totalUnrealizedPnL += t.type === 'LONG' ? (liveCMP - t.entry) * t.qty : (t.entry - liveCMP) * t.qty;
                } else {
                    totalRealizedPnL += t.pnl; closedCount++; if (t.pnl > 0) totalWins++;
                    const pnlColor = t.pnl >= 0 ? 'text-emerald-400' : 'text-rose-400';
                    closedBody.innerHTML += `
                    <tr class="hover:bg-slate-800/30 transition-colors opacity-80 hover:opacity-100 border-b border-slate-800/30">
                        <td class="py-3 px-6"><div class="font-bold text-slate-200 font-mono text-sm">${t.symbol}</div><div class="text-[9px] text-slate-500 uppercase tracking-wider">${t.date}</div></td>
                        <td class="py-3 px-6 text-center"><span class="font-black font-mono text-slate-300 mr-2 text-sm">${t.qty}</span><span class="${t.type === 'LONG' ? 'text-emerald-500 border-emerald-500/20 bg-emerald-500/10' : 'text-rose-500 border-rose-500/20 bg-rose-500/10'} border px-1.5 py-0.5 rounded text-[9px] font-bold uppercase">${t.type}</span></td>
                        <td class="py-3 px-6 font-mono text-xs"><span class="text-slate-400">₹${t.entry.toFixed(2)}</span> <span class="text-slate-600 mx-1">→</span> <span class="text-slate-300">₹${t.exit.toFixed(2)}</span></td>
                        <td class="py-3 px-6 font-black font-mono text-right ${pnlColor} text-base">${t.pnl >= 0 ? '+' : ''}₹${t.pnl.toFixed(2)}</td>
                        <td class="py-3 px-6 text-center"><button onclick="deleteTrade(${t.id})" class="text-slate-500 hover:text-rose-500 hover:bg-rose-500/10 w-8 h-8 rounded flex items-center justify-center mx-auto transition">×</button></td>
                    </tr>`;
                }
            });

            document.getElementById('netPnL').innerText = (totalRealizedPnL >= 0 ? '+' : '') + '₹' + totalRealizedPnL.toLocaleString('en-IN', { maximumFractionDigits: 2 });
            document.getElementById('netPnL').className = `text-2xl font-black font-mono tracking-tight ${totalRealizedPnL >= 0 ? 'text-emerald-400' : 'text-rose-400'}`;
            document.getElementById('winRateTxt').innerText = closedCount > 0 ? ((totalWins / closedCount) * 100).toFixed(1) + '%' : '0%';
            document.getElementById('totalInvested').innerText = '₹' + totalInvestedAmt.toLocaleString('en-IN', { maximumFractionDigits: 2 });
            document.getElementById('unrealizedPnL').innerText = (totalUnrealizedPnL >= 0 ? '+' : '') + '₹' + totalUnrealizedPnL.toLocaleString('en-IN', { maximumFractionDigits: 2 });
            document.getElementById('unrealizedPnL').className = `text-2xl font-black font-mono tracking-tight ${totalUnrealizedPnL >= 0 ? 'text-emerald-400' : 'text-rose-400'}`;
            
            // Render the main Grid View
            renderMultiCharts();
        }

        // ================= MARKET HOURS CHECKER =================
        function isMarketOpen() {
            const now = new Date();
            const day = now.getDay(); // 0 = Sunday, 6 = Saturday
            
            if (day === 0 || day === 6) return false;
            
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const currentTimeInMinutes = hours * 60 + minutes;
            
            const marketOpenTime = 9 * 60 + 15;  // 09:15 AM
            const marketCloseTime = 15 * 60 + 30; // 03:30 PM
            
            return currentTimeInMinutes >= marketOpenTime && currentTimeInMinutes <= marketCloseTime;
        }

       // ================= ADVANCED GRID RENDER (Anti-Flicker & Valvo Style) =================
        function renderMultiCharts() {
            const container = document.getElementById('multiChartContainer');
            const openTrades = trades.filter(t => t.status === 'OPEN');
            
            // Clean up deleted/closed cards from DOM to prevent ghost charts
            Array.from(container.children).forEach(child => {
                if (child.id.startsWith('grid_card_')) {
                    const id = parseInt(child.id.split('_')[2]);
                    if (!openTrades.find(t => t.id === id)) child.remove();
                }
            });

            if (openTrades.length === 0) {
                container.innerHTML = `<div class="col-span-full glass-card p-16 text-center text-slate-500 font-mono uppercase tracking-widest text-xs border border-slate-800 border-dashed">No active positions to display in grid.</div>`;
                return;
            } else if (container.querySelector('.col-span-full')) {
                container.innerHTML = '';
            }

            const marketLive = isMarketOpen();

            openTrades.forEach(t => {
                const cardId = 'grid_card_' + t.id;
                const chartId = 'tv_mini_' + t.id;
                const liveCMP = t.liveCMP || t.entry;
                const invested = t.qty * t.entry;
                
                const unrealized = t.type === 'LONG' ? (liveCMP - t.entry) * t.qty : (t.entry - liveCMP) * t.qty;
                const profitPct = ((liveCMP - t.entry) / t.entry) * 100;
                const finalPct = t.type === 'LONG' ? profitPct : -profitPct;
                const pnlColor = unrealized >= 0 ? 'text-emerald-400' : 'text-rose-400';
                
                // Day Change Calc
                const prevClose = t.prevClose || t.entry; 
                const dayChangeVal = t.type === 'LONG' ? (liveCMP - prevClose) * t.qty : (prevClose - liveCMP) * t.qty;
                const dayColor = dayChangeVal >= 0 ? 'text-emerald-400' : 'text-rose-400';

                const priceLabel = marketLive ? "CMP" : "LTP";
                const slBadge = t.slHit ? `<span class="text-[10px] bg-rose-600 text-white px-2 py-0.5 rounded uppercase ml-2 animate-pulse font-bold">SL HIT</span>` : '';

                let card = document.getElementById(cardId);
                if (!card) {
                    card = document.createElement('div');
                    card.id = cardId;
                    card.className = `glass-card flex flex-col h-[420px] overflow-hidden border border-slate-700/50 hover:border-sky-500/30 transition-all`;
                    
                    card.innerHTML = `
                        <!-- TOP DATA BAR -->
                        <div class="px-4 py-3 bg-slate-900/80 flex justify-between items-start">
                            <div class="flex flex-col">
                                <div class="flex items-center gap-2">
                                    <span class="font-black text-white font-mono text-xl">${t.symbol}</span>
                                    <span class="text-xs font-bold px-2 py-0.5 rounded border text-slate-400 border-slate-700">${t.type} x${t.qty}</span>
                                    ${slBadge}
                                </div>
                                <span class="text-xs text-slate-400 font-mono mt-1.5">Invested: ₹${invested.toLocaleString('en-IN', {maximumFractionDigits:0})}</span>
                            </div>
                            <div class="text-right flex flex-col items-end">
                                <span id="pct_${t.id}" class="font-black ${pnlColor} text-2xl tracking-tight">${finalPct >= 0 ? '+' : ''}${finalPct.toFixed(2)}%</span>
                                <div class="flex flex-col text-xs font-mono font-bold mt-1.5 gap-1">
                                    <span id="tot_${t.id}" class="${pnlColor}">Total: ${unrealized >= 0 ? '+' : ''}₹${unrealized.toFixed(2)}</span>
                                    <span id="day_${t.id}" class="${dayColor}">Day: ${dayChangeVal >= 0 ? '+' : ''}₹${dayChangeVal.toFixed(2)}</span>
                                </div>
                            </div>
                        </div>
                        
                        <!-- TRADING VIEW CHART -->
                        <div id="${chartId}" class="w-full flex-1 bg-[#0f172a] border-y border-slate-800/50 min-h-[180px]"></div>
                        
                        <!-- BOTTOM CONTROL BAR -->
                        <div class="px-4 py-3 bg-slate-950/80 flex justify-between items-center font-mono">
                            <div class="flex flex-col text-xs text-slate-400 gap-1.5">
                                <div>Entry: <span class="text-white font-bold ml-1 text-sm">₹${t.entry.toFixed(2)}</span></div>
                                <div class="flex items-center"><span id="label_${t.id}" class="w-8">${priceLabel}</span>: <span id="cmp_${t.id}" class="text-sky-400 font-black ml-1 text-sm bg-slate-900/50 px-2 py-0.5 rounded border border-slate-700/50">₹${liveCMP.toFixed(2)}</span></div>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="openEditModal(${t.id})" class="text-xs bg-slate-800/80 hover:bg-blue-500/20 text-slate-400 hover:text-blue-400 px-3 py-2 rounded-lg transition border border-slate-700">✏️</button>
                                <button onclick="openCloseModal(${t.id}, '${t.symbol}')" class="text-xs bg-slate-800/80 hover:bg-purple-500/20 text-slate-400 hover:text-purple-400 px-3 py-2 rounded-lg transition border border-slate-700">⏏️</button>
                                <button onclick="deleteTrade(${t.id})" class="text-xs bg-slate-800/80 hover:bg-rose-500/20 text-slate-500 hover:text-rose-500 px-3 py-2 rounded-lg transition border border-slate-700">❌</button>
                            </div>
                        </div>`;
                    
                    container.appendChild(card);
                    
                    new TradingView.widget({
                        "autosize": true, "symbol": formatTVSymbol(t.symbol), "interval": "D",
                        "timezone": "Asia/Kolkata", "theme": "dark", "style": "1", "locale": "in",
                        "enable_publishing": false, "backgroundColor": "#0f172a",
                        "hide_top_toolbar": true, "hide_side_toolbar": true, "hide_legend": true,
                        "save_image": false, "container_id": chartId
                    });
                } else {
                    // Update Text seamlessly without reloading iframe
                    document.getElementById(`label_${t.id}`).innerText = priceLabel;
                    document.getElementById(`pct_${t.id}`).className = `font-black ${pnlColor} text-2xl tracking-tight`;
                    document.getElementById(`pct_${t.id}`).innerText = `${finalPct >= 0 ? '+' : ''}${finalPct.toFixed(2)}%`;
                    document.getElementById(`tot_${t.id}`).className = pnlColor;
                    document.getElementById(`tot_${t.id}`).innerText = `Total: ${unrealized >= 0 ? '+' : ''}₹${unrealized.toFixed(2)}`;
                    document.getElementById(`day_${t.id}`).className = dayColor;
                    document.getElementById(`day_${t.id}`).innerText = `Day: ${dayChangeVal >= 0 ? '+' : ''}₹${dayChangeVal.toFixed(2)}`;
                    
                    const cmpDisplay = document.getElementById(`cmp_${t.id}`);
                    if(cmpDisplay) cmpDisplay.innerText = `₹${liveCMP.toFixed(2)}`;
                }
            });
        }
                    // Update Text seamlessly without reloading iframe
                    document.getElementById(`label_${t.id}`).innerText = priceLabel;
                    document.getElementById(`pct_${t.id}`).className = `font-black ${pnlColor} text-xl tracking-tight`;
                    document.getElementById(`pct_${t.id}`).innerText = `${finalPct >= 0 ? '+' : ''}${finalPct.toFixed(2)}%`;
                    document.getElementById(`tot_${t.id}`).className = pnlColor;
                    document.getElementById(`tot_${t.id}`).innerText = `Total: ${unrealized >= 0 ? '+' : ''}₹${unrealized.toFixed(2)}`;
                    document.getElementById(`day_${t.id}`).className = dayColor;
                    document.getElementById(`day_${t.id}`).innerText = `Day: ${dayChangeVal >= 0 ? '+' : ''}₹${dayChangeVal.toFixed(2)}`;
                    
                    const cmpInput = document.getElementById(`cmp_${t.id}`);
                    if(document.activeElement !== cmpInput) cmpInput.value = liveCMP;
                }
            });
        }

        // ================= WEBSOCKET LOGIC =================
        const SERVER_URL = "https://quantum-trader-api.onrender.com"; 
        const socket = io(SERVER_URL);

        socket.on('connect', () => {
            const btn = document.getElementById('autoSyncBtn');
            if(btn) { 
                btn.innerHTML = "Live Sync: ON 🟢"; 
                btn.className = "text-[10px] bg-emerald-500/10 text-emerald-400 px-4 py-2 rounded-lg uppercase font-bold border border-emerald-500/30 tracking-wider shadow-[0_0_10px_rgba(16,185,129,0.2)]"; 
            }
            subscribeOpenTrades();
        });

        socket.on('disconnect', () => {
            const btn = document.getElementById('autoSyncBtn');
            if(btn) { 
                btn.innerHTML = "Live Sync: OFF 🔴"; 
                btn.className = "text-[10px] bg-slate-800/80 text-slate-300 px-4 py-2 rounded-lg uppercase font-bold border border-slate-600 tracking-wider"; 
            }
        });

        socket.on('live_price', (data) => {
            let isUpdated = false;
            trades.forEach(t => {
                if (t.status === 'OPEN' && t.symbol === data.symbol) {
                    t.liveCMP = parseFloat(data.price); 
                    checkStopLoss(t);
                    isUpdated = true;
                }
            });
            if (isUpdated) { saveData(); renderUI(); }
        });

        async function subscribeOpenTrades() {
            const symbols = trades.filter(t => t.status === 'OPEN').map(t => t.symbol);
            if (symbols.length > 0) {
                try { await fetch(`${SERVER_URL}/api/subscribe`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ symbols: symbols }) }); } 
                catch (e) { console.error("Subscription failed:", e); }
            }
        }
    </script>
</body>
</html>
