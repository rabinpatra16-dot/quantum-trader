<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuantumTrader | V8.6 LIVE CHART</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#020617">
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { background-color: #020617; color: #f8fafc; font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .glass-card { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 16px; }
        .input-ultra { background: rgba(2, 6, 23, 0.8); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; padding: 10px 14px; color: white; width: 100%; outline: none; }
        .input-ultra:focus { border-color: #38bdf8; }
        .btn-ultra { background: linear-gradient(135deg, #0ea5e9 0%, #6366f1 50%, #a855f7 100%); color: white; font-weight: 700; padding: 14px; border-radius: 8px; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 10px; }
        .live-glow { animation: pulseGlow 2s infinite; }
        @keyframes pulseGlow { 0% { box-shadow: 0 0 0 0 rgba(14, 165, 233, 0.4); } 70% { box-shadow: 0 0 0 6px rgba(14, 165, 233, 0); } 100% { box-shadow: 0 0 0 0 rgba(14, 165, 233, 0); } }
        
        /* Container for the live chart */
        #tv_chart_container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; padding-top: 3px; }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen">

    <div class="max-w-[1600px] mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 border-b border-slate-800 pb-6 gap-4">
            <div>
                <h1 class="text-3xl font-black tracking-tight">QUANTUM<span class="text-sky-400">TRADER</span> <span class="text-[10px] bg-emerald-500/10 text-emerald-400 px-2 rounded font-bold">V8.6 LIVE</span></h1>
                <p class="text-xs text-slate-400 mt-2 uppercase font-mono">True Real-Time Engine</p>
            </div>
            <div class="flex gap-3">
                <button onclick="toggleView('main')" id="btnMain" class="text-xs font-bold bg-slate-800 text-white px-4 py-2 rounded-lg border-slate-700 shadow-inner">📊 Dashboard</button>
                <button onclick="toggleView('grid')" id="btnGrid" class="text-xs font-bold text-slate-400 hover:text-white hover:bg-slate-800 px-4 py-2 rounded-lg border-transparent">🔲 Grid</button>
                <button onclick="clearHistory()" class="text-xs font-semibold text-rose-400 border border-rose-950 px-4 py-2 rounded-lg">Wipe DB</button>
            </div>
        </header>

        <div id="view-main" class="grid grid-cols-1 xl:grid-cols-12 gap-6 transition-all duration-300">
            <div class="xl:col-span-3 space-y-6 h-fit sticky top-6">
                <div class="glass-card p-6">
                    <h2 class="text-xs font-bold text-slate-300 uppercase tracking-widest mb-6 flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-emerald-400 live-glow"></span> Execute Order</h2>
                    <form id="tradeForm" class="space-y-4">
                        <div class="grid grid-cols-3 gap-2">
                            <div class="col-span-2"><label class="block text-[10px] text-slate-400 mb-1">SYMBOL</label><input type="text" id="symbol" list="tickers" required class="input-ultra font-mono text-sm uppercase"><datalist id="tickers"></datalist></div>
                            <div><label class="block text-[10px] text-slate-400 mb-1">TAG</label><select id="tag" class="input-ultra text-xs h-[42px] p-1"><option>Scalp</option><option>Intraday</option><option>Swing</option></select></div>
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div><label class="block text-[10px] text-slate-400 mb-1">DIRECTION</label><select id="type" class="input-ultra text-sm"><option value="LONG">LONG</option><option value="SHORT">SHORT</option></select></div>
                            <div><label class="block text-[10px] text-slate-400 mb-1">QUANTITY</label><input type="number" id="qty" required step="any" class="input-ultra font-mono text-sm"></div>
                        </div>
                        <div class="p-4 bg-slate-900/50 rounded-lg border border-slate-800 space-y-4">
                            <div><label class="block text-[10px] text-slate-400 mb-1">ENTRY PRICE</label><input type="number" id="entry" required step="any" class="input-ultra font-mono text-sm text-sky-400"></div>
                            <div class="grid grid-cols-2 gap-3">
                                <div><label class="block text-[10px] text-rose-400 mb-1">SL (%)</label><input type="number" id="sl_pct" step="any" class="input-ultra font-mono text-xs border-rose-900/30 bg-rose-950/10"></div>
                                <div><label class="block text-[10px] text-emerald-400 mb-1">TARGET</label><input type="number" id="exit" step="any" class="input-ultra font-mono text-xs border-emerald-900/30 bg-emerald-950/10"></div>
                            </div>
                        </div>
                        <button type="submit" class="w-full btn-ultra text-xs uppercase tracking-widest mt-2">Place Order</button>
                    </form>
                </div>
            </div>

            <div class="xl:col-span-9 space-y-6">
                <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
                    <div class="glass-card p-5"><h3 class="text-[10px] text-slate-400 uppercase font-semibold">Realized P&L</h3><p id="netPnL" class="text-3xl font-black mt-2 font-mono text-emerald-400">₹0.00</p></div>
                    <div class="glass-card p-5"><h3 class="text-[10px] text-slate-400 uppercase font-semibold">Win Rate</h3><p id="winRateTxt" class="text-3xl font-black mt-2 font-mono text-sky-400">0%</p></div>
                    <div class="glass-card p-5"><h3 class="text-[10px] text-slate-400 uppercase font-semibold">Total Invested</h3><p id="totalInvested" class="text-3xl font-black mt-2 font-mono text-indigo-400">₹0.00</p></div>
                    <div class="glass-card p-5"><h3 class="text-[10px] text-slate-400 uppercase font-semibold">Unrealized P&L</h3><p id="unrealizedPnL" class="text-3xl font-black mt-2 font-mono text-slate-500">₹0.00</p></div>
                </div>

                <div class="glass-card overflow-hidden h-[450px] relative">
                    <div class="absolute top-0 left-0 w-full h-[3px] bg-gradient-to-r from-sky-400 to-indigo-500 z-20"></div>
                    <div id="chartSymbolLabel" class="absolute top-4 left-4 z-20 text-2xl font-black font-mono text-white/50 tracking-tighter"></div>
                    <div id="tv_chart_container"></div>
                </div>

                <div class="glass-card overflow-hidden border-sky-900/50">
                    <div class="flex justify-between items-center p-4 border-b border-slate-800 bg-sky-950/10">
                        <h3 class="text-xs text-sky-400 font-bold uppercase flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-sky-400 live-glow"></span> Active Positions</h3>
                        <div class="flex gap-2">
                            <button id="autoSyncBtn" onclick="toggleAutoSync()" class="text-[10px] bg-slate-800 text-slate-400 px-3 py-1.5 rounded uppercase font-bold border border-slate-700">Auto-Sync: OFF 🔴</button>
                            <button onclick="triggerLiveFetch()" class="text-[10px] bg-sky-500/20 text-sky-300 px-3 py-1.5 rounded uppercase font-bold border border-sky-500/30">⚡ Sync Now</button>
                        </div>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm whitespace-nowrap">
                            <thead><tr class="bg-slate-900/30 text-[10px] text-slate-400 uppercase border-b border-slate-800"><th class="py-3 px-5">Symbol</th><th class="py-3 px-5 text-center">Qty</th><th class="py-3 px-5">Entry & SL</th><th class="py-3 px-5">Invested (₹)</th><th class="py-3 px-5 text-center">Live CMP (₹)</th><th class="py-3 px-5 text-right">P&L (%)</th><th class="py-3 px-5 text-center">Action</th></tr></thead>
                            <tbody id="openPositionsBody" class="divide-y divide-slate-800/40"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <div id="view-grid" class="hidden transition-all duration-300">
            <div class="mb-4"><h2 class="text-xl font-bold text-white flex items-center gap-3"><span class="w-3 h-3 rounded-full bg-sky-500 live-glow"></span> Open Positions Grid</h2></div>
            <div id="multiChartContainer" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6"></div>
        </div>
    </div>

    <div id="closeModal" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-50">
        <div class="glass-card p-6 w-full max-w-sm"><input type="hidden" id="modalTradeId"><input type="number" id="modalExitPrice" placeholder="Final Exit Price" class="input-ultra mb-4"><button onclick="submitCloseTrade()" class="w-full bg-purple-600 p-2 rounded text-white font-bold">Confirm Exit</button></div>
    </div>

    <script>
        // ================= FIREBASE =================
        const FIREBASE_DB_URL = "https://quantum-tracker-6fe30-default-rtdb.firebaseio.com";
        firebase.initializeApp({ databaseURL: FIREBASE_DB_URL });
        const fbDatabase = firebase.database();

        let trades = [];
        let autoSyncTimer = null;
        let isAutoSyncing = false;
        let currentView = 'main';

        // Tickers
        const popularStocks = ["NIFTY", "BANKNIFTY", "SENSEX", "RELIANCE", "TCS", "HDFCBANK", "INFY"];
        popularStocks.forEach(s => document.getElementById('tickers').innerHTML += `<option value="${s}">`);

        fbDatabase.ref('trades').on('value', (s) => { trades = s.val() || []; renderUI(); });
        function saveData() { fbDatabase.ref('trades').set(trades); }

        // ================= REAL-TIME CHART LOGIC (Lightweight Charts) =================
        let mainChart = null;
        let candleSeries = null;
        let currentChartSymbol = '';
        let lastCandle = null;

        async function loadMainChart(symbol) {
            currentChartSymbol = symbol.toUpperCase();
            document.getElementById('chartSymbolLabel').innerText = currentChartSymbol;
            
            const container = document.getElementById('tv_chart_container');
            container.innerHTML = ''; // Clear old chart
            
            // Create Chart
            mainChart = LightweightCharts.createChart(container, {
                layout: { background: { type: 'solid', color: 'transparent' }, textColor: '#cbd5e1' },
                grid: { vertLines: { color: 'rgba(30, 41, 59, 0.4)' }, horzLines: { color: 'rgba(30, 41, 59, 0.4)' } },
                crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
                timeScale: { timeVisible: true, secondsVisible: false, borderColor: 'rgba(30, 41, 59, 0.8)' },
                rightPriceScale: { borderColor: 'rgba(30, 41, 59, 0.8)' }
            });
            
            candleSeries = mainChart.addCandlestickSeries({
                upColor: '#10b981', downColor: '#ef4444', borderVisible: false, wickUpColor: '#10b981', wickDownColor: '#ef4444'
            });

            // Resize observer to keep chart responsive
            new ResizeObserver(entries => {
                if(entries.length === 0 || entries[0].target !== container) return;
                mainChart.applyOptions({ height: entries[0].contentRect.height, width: entries[0].contentRect.width });
            }).observe(container);

            // Fetch History from Local Python Server
            try {
                const res = await fetch(`http://127.0.0.1:5000/api/history/${currentChartSymbol}`);
                const json = await res.json();
                if(json.status === 'success' && json.data.length > 0) {
                    candleSeries.setData(json.data);
                    lastCandle = json.data[json.data.length - 1]; // Save the last candle for live updates
                }
            } catch(e) { console.error("Failed to fetch historical data. Is the Python server running?"); }
        }

        // Initialize with NIFTY
        window.onload = () => { loadMainChart("NIFTY"); };

        // ================= LIVE FETCH ENGINE =================
        async function triggerLiveFetch() {
            // 1. Update Open Trades
            const openTrades = trades.filter(t => t.status === 'OPEN');
            for(let t of openTrades) {
                try {
                    const res = await fetch(`http://127.0.0.1:5000/api/price/${t.symbol}`);
                    const data = await res.json();
                    if(data.status === 'success') { t.liveCMP = data.price; }
                } catch(e) {}
            }
            saveData();

            // 2. Update Live Chart independently
            if(currentChartSymbol && lastCandle && candleSeries) {
                try {
                    const res = await fetch(`http://127.0.0.1:5000/api/price/${currentChartSymbol}`);
                    const data = await res.json();
                    if(data.status === 'success') {
                        const livePrice = data.price;
                        // Dynamically move the candle
                        lastCandle.close = livePrice;
                        if(livePrice > lastCandle.high) lastCandle.high = livePrice;
                        if(livePrice < lastCandle.low) lastCandle.low = livePrice;
                        candleSeries.update(lastCandle);
                    }
                } catch(e) {}
            }
        }

        function toggleAutoSync() {
            isAutoSyncing = !isAutoSyncing; const btn = document.getElementById('autoSyncBtn');
            if(isAutoSyncing) {
                btn.innerHTML = "Auto-Sync: ON 🟢"; btn.className = "text-[10px] bg-emerald-500/20 text-emerald-300 px-3 py-1.5 rounded uppercase font-bold border border-emerald-500/40 sync-active-glow";
                triggerLiveFetch(); autoSyncTimer = setInterval(triggerLiveFetch, 10000); // 10 seconds refresh
            } else {
                btn.innerHTML = "Auto-Sync: OFF 🔴"; btn.className = "text-[10px] bg-slate-800 text-slate-400 px-3 py-1.5 rounded uppercase font-bold border border-slate-700";
                clearInterval(autoSyncTimer);
            }
        }

        // ================= FORM & UI LOGIC =================
        document.getElementById('tradeForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const symbol = document.getElementById('symbol').value.toUpperCase();
            const type = document.getElementById('type').value;
            const qty = parseFloat(document.getElementById('qty').value);
            const entry = parseFloat(document.getElementById('entry').value);
            trades.unshift({ id: Date.now(), symbol, type, qty, entry, slHit: false, status: 'OPEN', liveCMP: entry, pnl: 0 });
            saveData(); loadMainChart(symbol); this.reset();
        });

        function updateLiveCMP(id, newCMP) {
            const t = trades.find(t => t.id === id);
            if(t && !isNaN(newCMP)) { t.liveCMP = parseFloat(newCMP); saveData(); }
        }

        function openCloseModal(id, sym) { document.getElementById('modalTradeId').value = id; document.getElementById('closeModal').style.display = 'flex'; }
        function submitCloseTrade() {
            const id = parseInt(document.getElementById('modalTradeId').value); const exit = parseFloat(document.getElementById('modalExitPrice').value);
            const t = trades.find(t => t.id === id);
            if(t && !isNaN(exit)) {
                t.exit = exit; t.status = 'CLOSED'; t.pnl = t.type === 'LONG' ? (exit - t.entry)*t.qty : (t.entry - exit)*t.qty;
                saveData(); document.getElementById('closeModal').style.display = 'none';
            }
        }

        function clearHistory() { if(confirm("Wipe DB?")) { trades = []; saveData(); } }
        function deleteTrade(id) { trades = trades.filter(t => t.id !== id); saveData(); }
        function toggleView(v) { 
            currentView = v; 
            document.getElementById('view-main').classList.toggle('hidden', v==='grid');
            document.getElementById('view-grid').classList.toggle('hidden', v==='main');
            if(v === 'grid') renderMultiCharts();
        }

        function renderUI() {
            const body = document.getElementById('openPositionsBody'); body.innerHTML = '';
            let unPnL = 0, realPnL = 0, inv = 0;
            
            trades.filter(t => t.status === 'OPEN').forEach(t => {
                const cmp = t.liveCMP || t.entry; const used = t.qty * t.entry; inv += used;
                let pnl = t.type === 'LONG' ? (cmp - t.entry)*t.qty : (t.entry - cmp)*t.qty; unPnL += pnl;
                const pct = ((cmp - t.entry)/t.entry)*100 * (t.type === 'LONG'?1:-1);
                const col = pnl >= 0 ? 'text-emerald-400' : 'text-rose-400';
                
                body.innerHTML += `<tr class="hover:bg-slate-800/50">
                    <td class="py-3 px-5 font-bold cursor-pointer hover:text-sky-400" onclick="loadMainChart('${t.symbol}')">${t.symbol}</td>
                    <td class="py-3 px-5 text-center">${t.qty}</td>
                    <td class="py-3 px-5">₹${t.entry.toFixed(2)}</td>
                    <td class="py-3 px-5">₹${used.toFixed(0)}</td>
                    <td class="py-3 px-5"><input type="number" value="${cmp}" onchange="updateLiveCMP(${t.id}, this.value)" class="w-20 bg-slate-900 border border-slate-700 p-1 text-center rounded text-xs"></td>
                    <td class="py-3 px-5 text-right font-bold ${col}">${pnl>=0?'+':''}₹${pnl.toFixed(2)} <br><span class="text-[9px]">(${pct>=0?'+':''}${pct.toFixed(2)}%)</span></td>
                    <td class="py-3 px-5 text-center"><button onclick="openCloseModal(${t.id}, '${t.symbol}')" class="text-purple-400 hover:text-purple-300 text-xs font-bold border border-purple-500/30 px-2 py-1 rounded">Exit</button></td>
                </tr>`;
            });
            
            trades.filter(t => t.status === 'CLOSED').forEach(t => realPnL += t.pnl);
            
            document.getElementById('netPnL').innerText = `₹${realPnL.toFixed(2)}`;
            document.getElementById('totalInvested').innerText = `₹${inv.toFixed(0)}`;
            document.getElementById('unrealizedPnL').innerText = `${unPnL>=0?'+':''}₹${unPnL.toFixed(2)}`;
            document.getElementById('unrealizedPnL').className = `text-3xl font-black mt-2 font-mono ${unPnL>=0?'text-emerald-400':'text-rose-400'}`;
        }

        // Grid charts (Classic TV)
        function renderMultiCharts() {
            const cont = document.getElementById('multiChartContainer'); cont.innerHTML = '';
            trades.filter(t => t.status === 'OPEN').forEach(t => {
                const id = 'tv_mini_' + t.id;
                cont.innerHTML += `<div class="glass-card h-[300px] border-t border-sky-500"><div class="p-2 flex justify-between"><span class="font-bold cursor-pointer" onclick="loadMainChart('${t.symbol}'); toggleView('main');">${t.symbol}</span><span>${t.type} x${t.qty}</span></div><div id="${id}" class="h-full"></div></div>`;
                setTimeout(() => { new TradingView.widget({"autosize":true,"symbol":formatTVSymbol(t.symbol),"interval":"D","theme":"dark","hide_top_toolbar":true,"hide_legend":true,"save_image":false,"container_id":id}); }, 100);
            });
        }
    </script>
</body>
</html>
